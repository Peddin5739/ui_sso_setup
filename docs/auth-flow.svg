<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Animated Azure SSO auth flow: SPA to Entra ID to Node API to PostgreSQL">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1221"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="azure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2aa5ff"/>
      <stop offset="1" stop-color="#0078d4"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5bd06a"/>
      <stop offset="1" stop-color="#339933"/>
    </linearGradient>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#2f6fed"/>
    </linearGradient>
    <linearGradient id="spa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a5cff"/>
      <stop offset="1" stop-color="#5b36e0"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9fb3c8"/>
    </marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="860" height="300" rx="16" fill="url(#bg)"/>
  <text x="30" y="40" fill="#e6edf3" font-size="18" font-weight="700">Azure SSO — OIDC / OAuth 2.0 (Auth Code + PKCE)</text>
  <text x="30" y="62" fill="#8aa0b6" font-size="12">v2 access token · validated via JWKS · groups → roles in PostgreSQL</text>

  <g stroke-width="3" fill="none" opacity="0.8">
    <path d="M150 150 L300 115" stroke="#35506e" marker-end="url(#arrow)">
      <animate attributeName="stroke-dasharray" values="2 10;12 2" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M300 125 L150 158" stroke="#35506e" marker-end="url(#arrow)" opacity="0.5"/>
    <path d="M190 170 L560 170" stroke="#35506e" marker-end="url(#arrow)">
      <animate attributeName="stroke-dasharray" values="2 10;12 2" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
    </path>
    <path d="M620 170 L720 170" stroke="#35506e" marker-end="url(#arrow)">
      <animate attributeName="stroke-dasharray" values="2 10;12 2" dur="1.2s" begin="0.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g>
    <rect x="40" y="130" width="110" height="70" rx="12" fill="url(#spa)" filter="url(#glow)"/>
    <text x="95" y="162" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">React SPA</text>
    <text x="95" y="182" fill="#e8e3ff" font-size="10" text-anchor="middle">MSAL · PKCE</text>
  </g>
  <g>
    <rect x="245" y="85" width="120" height="70" rx="12" fill="url(#azure)" filter="url(#glow)"/>
    <text x="305" y="112" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Microsoft</text>
    <text x="305" y="130" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Entra ID</text>
    <text x="305" y="147" fill="#dbeeff" font-size="10" text-anchor="middle">tokens + groups</text>
  </g>
  <g>
    <rect x="455" y="135" width="120" height="70" rx="12" fill="url(#node)" filter="url(#glow)"/>
    <text x="515" y="162" fill="#06220c" font-size="13" font-weight="700" text-anchor="middle">Node API</text>
    <text x="515" y="182" fill="#0a3314" font-size="10" text-anchor="middle">verify JWT · roles</text>
  </g>
  <g>
    <rect x="715" y="135" width="110" height="70" rx="12" fill="url(#pg)" filter="url(#glow)"/>
    <text x="770" y="162" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">PostgreSQL</text>
    <text x="770" y="182" fill="#dfe8ff" font-size="10" text-anchor="middle">authz schema</text>
  </g>

  <g filter="url(#glow)">
    <circle r="13" fill="#ffd23f">
      <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;0.33;0.4;0.7;1" keyTimes="0;0.3;0.45;0.75;1" calcMode="linear"
        path="M95 165 L305 120 L305 120 L515 170 L770 170"/>
    </circle>
    <text font-size="9" font-weight="700" fill="#5b3b00" text-anchor="middle" dy="3">
      <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;0.33;0.4;0.7;1" keyTimes="0;0.3;0.45;0.75;1" calcMode="linear"
        path="M95 165 L305 120 L305 120 L515 170 L770 170"/>
      JWT
    </text>
  </g>

  <text x="195" y="100" fill="#8aa0b6" font-size="10">1. sign-in</text>
  <text x="200" y="205" fill="#8aa0b6" font-size="10">2. v2 token</text>
  <text x="360" y="160" fill="#8aa0b6" font-size="10">3. Bearer token</text>
  <text x="630" y="160" fill="#8aa0b6" font-size="10">4. resolve roles</text>

  <rect x="0.5" y="0.5" width="859" height="299" rx="16" fill="none" stroke="#1f2d44"/>
</svg>
